<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style></head>
<body><canvas id="c"></canvas>
<script>
// 基准测试：2 万个带辉光的粒子，WebGL 渲染，画面只由帧号决定
const N = 20000, SEED = 1234;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const canvas=document.getElementById('c');
let W=0,H=0,gl,prog,bloomProg,blurProg,compProg,buf,fboScene,fboA,fboB,texScene,texA,texB,quad;
const base=new Float32Array(N*4); // x0,y0,r,phase
const data=new Float32Array(N*6); // x,y,size,r,g,b
(function init(){const rnd=mulberry32(SEED);for(let i=0;i<N;i++){base[i*4]=rnd()*2-1;base[i*4+1]=rnd()*2-1;base[i*4+2]=0.02+rnd()*0.08;base[i*4+3]=rnd()*6.283;}})();
function sh(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(s));return s}
function pr(vs,fs){const p=gl.createProgram();gl.attachShader(p,sh(gl.VERTEX_SHADER,vs));gl.attachShader(p,sh(gl.FRAGMENT_SHADER,fs));gl.linkProgram(p);if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(p));return p}
function mkTex(w,h){const t=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,t);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,w,h,0,gl.RGBA,gl.UNSIGNED_BYTE,null);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);const f=gl.createFramebuffer();gl.bindFramebuffer(gl.FRAMEBUFFER,f);gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,t,0);return{t,f}}
window.setup=function(w,h){W=w;H=h;canvas.width=w;canvas.height=h;
 gl=canvas.getContext('webgl',{preserveDrawingBuffer:true,antialias:false,alpha:false});
 if(!gl)throw new Error('no webgl');
 const dbg=gl.getExtension('WEBGL_debug_renderer_info');window.__renderer=dbg?gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL):gl.getParameter(gl.RENDERER);
 prog=pr(`attribute vec2 p;attribute float s;attribute vec3 c;varying vec3 vc;uniform vec2 res;void main(){gl_Position=vec4(p.x,p.y*res.x/res.y,0.,1.);gl_PointSize=s*res.y;vc=c;}`,
  `precision mediump float;varying vec3 vc;void main(){vec2 d=gl_PointCoord-0.5;float r=dot(d,d)*4.;float a=exp(-r*4.)*(1.-smoothstep(0.8,1.,r));gl_FragColor=vec4(vc*a,a);}`);
 const qvs=`attribute vec2 p;varying vec2 uv;void main(){uv=p*0.5+0.5;gl_Position=vec4(p,0.,1.);}`;
 bloomProg=pr(qvs,`precision mediump float;varying vec2 uv;uniform sampler2D t;void main(){vec3 c=texture2D(t,uv).rgb;float l=dot(c,vec3(.3,.59,.11));gl_FragColor=vec4(c*smoothstep(0.2,0.8,l),1.);}`);
 blurProg=pr(qvs,`precision mediump float;varying vec2 uv;uniform sampler2D t;uniform vec2 dir;void main(){vec3 s=vec3(0.);float w[5];w[0]=0.227;w[1]=0.195;w[2]=0.122;w[3]=0.054;w[4]=0.016;s+=texture2D(t,uv).rgb*w[0];for(int i=1;i<5;i++){s+=texture2D(t,uv+dir*float(i)).rgb*w[i];s+=texture2D(t,uv-dir*float(i)).rgb*w[i];}gl_FragColor=vec4(s,1.);}`);
 compProg=pr(qvs,`precision mediump float;varying vec2 uv;uniform sampler2D a;uniform sampler2D b;uniform float fr;void main(){vec3 c=texture2D(a,uv).rgb+texture2D(b,uv).rgb*1.6;c=c/(1.+c);float n=fract(sin(dot(uv*vec2(W,H)+fr,vec2(12.9898,78.233)))*43758.5453);c+=(n-0.5)*0.03;float v=1.-0.5*dot(uv-0.5,uv-0.5)*2.;gl_FragColor=vec4(c*v,1.);}`.replace('W',w+'.').replace('H',h+'.'));
 buf=gl.createBuffer();quad=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,quad);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
 fboScene=mkTex(w,h);fboA=mkTex(w>>2,h>>2);fboB=mkTex(w>>2,h>>2);
 return window.__renderer;};
function quadDraw(p){gl.useProgram(p);gl.bindBuffer(gl.ARRAY_BUFFER,quad);const l=gl.getAttribLocation(p,'p');gl.enableVertexAttribArray(l);gl.vertexAttribPointer(l,2,gl.FLOAT,false,0,0);gl.drawArrays(gl.TRIANGLE_STRIP,0,4);}
window.renderFrame=function(frame){const t0=performance.now();const t=frame/30;
 for(let i=0;i<N;i++){const a=base[i*4+3]+t*0.7,r=base[i*4+2];data[i*6]=base[i*4]+Math.cos(a)*r*3;data[i*6+1]=base[i*4+1]+Math.sin(a*1.3)*r*3;data[i*6+2]=0.004+r*0.1;const h=(i/N+t*0.1)%1;data[i*6+3]=0.5+0.5*Math.cos(6.283*h);data[i*6+4]=0.5+0.5*Math.cos(6.283*(h+0.33));data[i*6+5]=0.5+0.5*Math.cos(6.283*(h+0.66));}
 gl.bindFramebuffer(gl.FRAMEBUFFER,fboScene.f);gl.viewport(0,0,W,H);gl.clearColor(0.04,0.05,0.09,1);gl.clear(gl.COLOR_BUFFER_BIT);
 gl.enable(gl.BLEND);gl.blendFunc(gl.ONE,gl.ONE);gl.useProgram(prog);gl.bindBuffer(gl.ARRAY_BUFFER,buf);gl.bufferData(gl.ARRAY_BUFFER,data,gl.DYNAMIC_DRAW);
 const lp=gl.getAttribLocation(prog,'p'),ls=gl.getAttribLocation(prog,'s'),lc=gl.getAttribLocation(prog,'c');
 gl.enableVertexAttribArray(lp);gl.vertexAttribPointer(lp,2,gl.FLOAT,false,24,0);gl.enableVertexAttribArray(ls);gl.vertexAttribPointer(ls,1,gl.FLOAT,false,24,8);gl.enableVertexAttribArray(lc);gl.vertexAttribPointer(lc,3,gl.FLOAT,false,24,12);
 gl.uniform2f(gl.getUniformLocation(prog,'res'),W,H);gl.drawArrays(gl.POINTS,0,N);gl.disable(gl.BLEND);
 gl.bindFramebuffer(gl.FRAMEBUFFER,fboA.f);gl.viewport(0,0,W>>2,H>>2);gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,fboScene.t);quadDraw(bloomProg);
 for(let k=0;k<2;k++){gl.bindFramebuffer(gl.FRAMEBUFFER,fboB.f);gl.bindTexture(gl.TEXTURE_2D,fboA.t);gl.useProgram(blurProg);gl.uniform2f(gl.getUniformLocation(blurProg,'dir'),4/W,0);quadDraw(blurProg);
 gl.bindFramebuffer(gl.FRAMEBUFFER,fboA.f);gl.bindTexture(gl.TEXTURE_2D,fboB.t);gl.useProgram(blurProg);gl.uniform2f(gl.getUniformLocation(blurProg,'dir'),0,4/H);quadDraw(blurProg);}
 gl.bindFramebuffer(gl.FRAMEBUFFER,null);gl.viewport(0,0,W,H);gl.useProgram(compProg);gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,fboScene.t);gl.uniform1i(gl.getUniformLocation(compProg,'a'),0);gl.activeTexture(gl.TEXTURE1);gl.bindTexture(gl.TEXTURE_2D,fboA.t);gl.uniform1i(gl.getUniformLocation(compProg,'b'),1);gl.uniform1f(gl.getUniformLocation(compProg,'fr'),frame);quadDraw(compProg);
 gl.finish();return performance.now()-t0;};
window.readRaw=function(){const px=new Uint8Array(W*H*4);gl.bindFramebuffer(gl.FRAMEBUFFER,null);gl.readPixels(0,0,W,H,gl.RGBA,gl.UNSIGNED_BYTE,px);let s='';const CH=0x8000;for(let i=0;i<px.length;i+=CH)s+=String.fromCharCode.apply(null,px.subarray(i,i+CH));return btoa(s);};
</script></body></html>
